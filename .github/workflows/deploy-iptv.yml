name: Deploy IPTV to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'iptv-platform/**'
      - 'iptv-server/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-iptv
  cancel-in-progress: true

jobs:
  deploy-iptv-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: iptv-platform/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: iptv-platform

      - name: Build
        run: npm run build
        working-directory: iptv-platform
        env:
          NEXT_PUBLIC_API_URL: https://osamap2-iptv-api.onrender.com

      - name: Install Wrangler CLI
        run: npm i -g wrangler@4

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler pages deploy out --project-name=osamap2-iptv
        working-directory: iptv-platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
